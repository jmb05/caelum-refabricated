plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		url 'https://api.modrinth.com/maven'
		content {
			includeGroup("maven.modrinth")
		}
	}
	maven {
		url "https://maven.flashyreese.me/releases"
	}
	maven {
		url = "https://minecraft.guntram.de/maven/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"

	modImplementation "maven.modrinth:sodium:${project.sodium_version}-fabric"
	modImplementation "me.flashyreese.mods:sodium-extra-fabric:${project.sodium_extra_version}"
	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"

	include(implementation("com.moulberry:mixinconstraints:${project.mixinconstraints_version}"))
	modImplementation "maven.modrinth:iris:${project.iris_version}-fabric"

	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		//noinspection GroovyAssignabilityCheck
        mavenJava(MavenPublication) {
			//noinspection GroovyAssignabilityCheck
            from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			credentials {
				username = System.getenv("JMB_REPO_NAME")
				password = System.getenv("JMB_REPO_TOKEN")
			}
			url "https://repo.jmb19905.net/releases"
		}
	}
}